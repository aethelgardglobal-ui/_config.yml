<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHELGARD | Registration</title>
    <style>
        :root { --gold: #d4af37; --black: #050505; }
        body { background: var(--black); color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .form-box { width: 100%; max-width: 400px; padding: 40px; border: 1px solid #222; background: #0a0a0a; }
        input, select { width: 100%; padding: 15px; margin: 15px 0; background: #000; border: 1px solid #333; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--gold); color: #000; border: none; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 style="color: var(--gold); text-transform: uppercase; letter-spacing: 3px; margin-top: 0;">Sign Up</h2>
        <p style="color: #666; font-size: 0.8rem;">Initialize your Sovereign ID on the Aethelgard Registry.</p>
        <form action="mailto:admin@aethelgard.global" method="post" enctype="text-plain">
            <input type="text" placeholder="Legal Name or Alias" required>
            <input type="email" placeholder="Secure Email Address" required>
            <select>
                <option>Select Specialization</option>
                <option>Maritime Engineer</option>
                <option>Lunar Logistics</option>
                <option>Labor & Ethics</option>
                <option>Software Architect</option>
            </select>
            <button type="submit">Initialize Protocol</button>
        </form>
        <a href="index.html" style="display: block; text-align: center; margin-top: 20px; color: #444; text-decoration: none; font-size: 0.7rem;">Back to Terminal</a>
    </div>
</body>
</html>
