<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHELGARD | Secure Registration</title>
    <style>
        :root { --gold: #d4af37; --black: #050505; --accent: #222; }
        body { background-color: var(--black); color: #eee; font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .signup-container { width: 100%; max-width: 450px; padding: 40px; background: #0a0a0a; border: 1px solid var(--accent); text-align: center; position: relative; border-top: 3px solid var(--gold); }
        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 4px; color: var(--gold); margin-bottom: 15px; }
        p { font-size: 0.85rem; color: #777; line-height: 1.6; margin-bottom: 35px; }
        .btn-secure { display: block; background: var(--gold); color: #000; text-decoration: none; padding: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; transition: 0.3s; }
        .btn-secure:hover { background: #fff; transform: scale(1.02); }
        .status-light { display: inline-block; width: 8px; height: 8px; background: #00ff00; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 10px #00ff00; }
        .security-text { font-family: monospace; font-size: 0.65rem; color: #444; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>Initialize ID</h1>
        <p>Aethelgard Sovereign Registry is processed via encrypted Google Cloud node for maximum security.</p>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLScAsbaislFBq-8X3pni_MhUVVjWilsuodhmDzGHNu-AwUO9hg/viewform" target="_blank" class="btn-secure">
            Open Secure Registry →
        </a>

        <div style="margin-top:30px; padding-top:20px; border-top: 1px solid var(--accent);">
            <span class="status-light"></span>
            <span class="security-text">Encryption: AES-256 Active</span>
        </div>
        <a href="index.html" style="display:block; margin-top:20px; color:#444; text-decoration:none; font-size:0.7rem;">Return to Terminal</a>
    </div>
</body>
</html>
